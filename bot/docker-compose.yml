# Ava, always on, on any Linux server with Docker.
#
#   cp .env.example .env      # then fill it in
#   docker compose up -d --build
#
# Her screen is a signed-in Google account, so it is never served over plain HTTP. Two ways
# to reach it:
#
#   - Private (default): only from the server itself, through an SSH tunnel from your
#     computer:  ssh -L 8080:localhost:8080 ubuntu@<server>   then http://localhost:8080/vnc.html
#
#   - Online, over HTTPS: set COMPOSE_PROFILES=public and AVA_SCREEN_HOST in .env (see
#     .env.example), open ports 80 and 443 to the server, and `docker compose up -d`.
#     Caddy gets a trusted certificate by itself; the screen's own password still applies.

services:
  ava:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # AVA_SCREEN_PORT if 8080 is already taken on this machine.
      - "127.0.0.1:${AVA_SCREEN_PORT:-8080}:8080"
    volumes:
      # Her signed-in Chrome profile and the list of meetings she has attended. Without a
      # persistent volume she is signed out every time the container restarts.
      - ava-data:/data
    # Chrome crashes tabs when /dev/shm is Docker's default 64 MB.
    shm_size: "1gb"

  # Her screen online, over HTTPS — only with COMPOSE_PROFILES=public.
  screen:
    image: caddy:2-alpine
    profiles: ["public"]
    restart: unless-stopped
    depends_on: [ava]
    ports:
      - "80:80"
      - "443:443"
    environment:
      AVA_SCREEN_HOST: ${AVA_SCREEN_HOST:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates, kept across restarts so they are not requested again every time.
      - screen-data:/data

volumes:
  ava-data:
  screen-data:
